<mat-toolbar color="primary" class="toolbar">
	<span class="brand">Tax Expense Tracker</span>

	<span class="spacer"></span>

	@if (session.isAuthenticated()) {
	<nav class="nav-links" aria-label="Primary navigation">
		<a mat-button routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
		<a mat-button routerLink="/expenses" routerLinkActive="active-link">Expenses</a>
		<a mat-button routerLink="/time-tracking" routerLinkActive="active-link">Time Tracking</a>
		<a mat-button routerLink="/calendar-batch-entry" routerLinkActive="active-link">Calendar Batch</a>
		<details #manageMenu class="manage-menu">
			<summary>Manage</summary>
			<nav class="manage-panel" aria-label="Management navigation">
				<a routerLink="/public-holidays" routerLinkActive="active-menu-item" (click)="closeMenu(manageMenu)">Holidays</a>
				<a routerLink="/trackers" routerLinkActive="active-menu-item" (click)="closeMenu(manageMenu)">Trackers</a>
				<a routerLink="/tags" routerLinkActive="active-menu-item" (click)="closeMenu(manageMenu)">Tags</a>
				<a routerLink="/banks" routerLinkActive="active-menu-item" (click)="closeMenu(manageMenu)">Banks</a>
				@if (session.isAdministrator()) {
					<a routerLink="/data-transfer" routerLinkActive="active-menu-item" (click)="closeMenu(manageMenu)">Data Transfer</a>
				}
			</nav>
		</details>
	</nav>
	}

	@if (session.enabled) {
		@if (session.isAuthenticated()) {
			<span class="identity">{{ session.displayName() }}</span>
			<button mat-button type="button" (click)="session.logout()">Sign out</button>
		} @else {
			<a mat-button routerLink="/login">Sign in</a>
		}
	}
</mat-toolbar>
